services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cyberpunk
      POSTGRES_PASSWORD: cyberpunk
      POSTGRES_DB: cyberpunk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberpunk -d cyberpunk"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://cyberpunk:cyberpunk@db:5432/cyberpunk
      PORT: "3100"
      SERVE_UI: "true"
      CYBERPUNK_DEPLOYMENT_MODE: "authenticated"
      CYBERPUNK_DEPLOYMENT_EXPOSURE: "private"
      CYBERPUNK_PUBLIC_URL: "${CYBERPUNK_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - cyberpunk-company-data:/cyberpunk-company
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  cyberpunk-company-data:
